<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hanzi De Go</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211f;
        --muted: #63706c;
        --paper: #f6f8f5;
        --panel: #ffffff;
        --line: #d8dfd8;
        --jade: #087b6c;
        --jade-dark: #055f55;
        --red: #c73838;
        --gold: #e1b12c;
        --sky: #cfe7ee;
        --track: #2f3534;
        --shadow: 0 18px 50px rgba(23, 33, 31, 0.13);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(207, 231, 238, 0.9), rgba(246, 248, 245, 0.9) 42%),
          var(--paper);
        color: var(--ink);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 32px 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        background: var(--jade);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 22px rgba(8, 123, 108, 0.25);
        font-size: 24px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 5px;
        color: var(--muted);
        font-size: 13px;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .segmented {
        display: grid;
        grid-auto-flow: column;
        gap: 4px;
        padding: 4px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--line);
      }

      .segmented button {
        min-width: 58px;
        height: 34px;
        padding: 0 11px;
        background: transparent;
        color: var(--muted);
        border-radius: 4px;
        font-weight: 800;
      }

      .segmented button.active {
        background: var(--ink);
        color: #fff;
      }

      .primary,
      .secondary,
      .ghost {
        height: 42px;
        padding: 0 16px;
        border-radius: 6px;
        font-weight: 800;
      }

      .primary {
        background: var(--red);
        color: #fff;
        box-shadow: 0 10px 22px rgba(199, 56, 56, 0.22);
      }

      .secondary {
        background: var(--jade);
        color: #fff;
      }

      .ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .game-shell {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 14px 32px 34px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        align-items: start;
      }

      .route {
        grid-column: 1 / -1;
        min-height: 132px;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)),
          var(--sky);
        border: 1px solid #b7d2d9;
        box-shadow: var(--shadow);
      }

      .route-sun {
        position: absolute;
        right: 42px;
        top: 20px;
        width: 52px;
        height: 52px;
        background: var(--gold);
        border-radius: 50%;
        box-shadow: 0 0 0 12px rgba(225, 177, 44, 0.18);
      }

      .mountains {
        position: absolute;
        inset: auto 0 34px;
        height: 70px;
        background:
          linear-gradient(135deg, transparent 0 34%, rgba(8, 123, 108, 0.22) 34% 64%, transparent 64%) 0 0 / 180px 70px,
          linear-gradient(225deg, transparent 0 38%, rgba(23, 33, 31, 0.14) 38% 68%, transparent 68%) 60px 8px / 210px 66px;
      }

      .track {
        position: absolute;
        left: 26px;
        right: 26px;
        bottom: 30px;
        height: 10px;
        background: repeating-linear-gradient(90deg, var(--track) 0 30px, #59615f 30px 36px);
        border-radius: 999px;
      }

      .track-fill {
        position: absolute;
        left: 26px;
        bottom: 30px;
        height: 10px;
        width: var(--train-x, 0%);
        max-width: calc(100% - 52px);
        background: var(--gold);
        border-radius: 999px;
        transition: width 280ms ease;
      }

      .train {
        position: absolute;
        left: clamp(70px, calc(26px + var(--train-x, 0%)), calc(100% - 70px));
        bottom: 45px;
        width: 136px;
        height: 42px;
        transform: translateX(-50%);
        transition: left 280ms ease;
      }

      .train-body {
        position: absolute;
        inset: 7px 0;
        background: var(--panel);
        border: 3px solid var(--ink);
        border-radius: 22px 8px 8px 22px;
        overflow: hidden;
      }

      .train-body::before {
        content: "";
        position: absolute;
        inset: 18px 0 0;
        background: var(--red);
      }

      .train-body::after {
        content: "";
        position: absolute;
        left: 24px;
        top: 6px;
        width: 72px;
        height: 10px;
        background: linear-gradient(90deg, var(--jade) 0 18px, transparent 18px 25px, var(--jade) 25px 43px, transparent 43px 50px, var(--jade) 50px);
      }

      .wheel {
        position: absolute;
        bottom: 1px;
        width: 15px;
        height: 15px;
        background: var(--ink);
        border: 3px solid #fff;
        border-radius: 50%;
      }

      .wheel.one {
        left: 28px;
      }

      .wheel.two {
        right: 26px;
      }

      .station-labels {
        position: absolute;
        left: 26px;
        right: 26px;
        bottom: 6px;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .station-labels span::before {
        content: "";
        display: block;
        width: 11px;
        height: 11px;
        margin-bottom: 2px;
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 50%;
      }

      .stage,
      .side {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .stage {
        min-height: 550px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .question-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 112px;
        height: 32px;
        padding: 0 12px;
        background: #eaf5f2;
        color: var(--jade-dark);
        border: 1px solid #b9dbd3;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .timer {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 74px;
        height: 38px;
        background: var(--ink);
        color: #fff;
        font-weight: 900;
        font-size: 18px;
      }

      .prompt-zone {
        display: grid;
        place-items: center;
        padding: 34px 26px 22px;
      }

      .chengyu-card {
        width: min(560px, 100%);
        min-height: 250px;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          linear-gradient(90deg, rgba(199, 56, 56, 0.08) 1px, transparent 1px),
          linear-gradient(0deg, rgba(199, 56, 56, 0.08) 1px, transparent 1px),
          #fff;
        background-size: 34px 34px;
        border: 4px solid var(--ink);
        box-shadow: 12px 12px 0 rgba(8, 123, 108, 0.16);
      }

      .chengyu-text {
        display: grid;
        grid-template-columns: repeat(var(--chengyu-columns, 4), minmax(54px, 88px));
        gap: 12px;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        font-family: "Noto Serif SC", "SimSun", "Microsoft YaHei UI", "Microsoft YaHei", serif;
        font-size: 70px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .chengyu-char {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 2px solid rgba(23, 33, 31, 0.18);
        background: rgba(255, 255, 255, 0.82);
      }

      .chengyu-char.blank {
        color: var(--red);
        border-color: var(--red);
        background: #fff4f4;
      }

      .answer-panel {
        display: grid;
        gap: 14px;
        padding: 20px;
        border-top: 1px solid var(--line);
      }

      .answer-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
      }

      .answer-input {
        width: 100%;
        height: 52px;
        padding: 0 16px;
        border: 2px solid var(--ink);
        background: #fff;
        color: var(--ink);
        border-radius: 6px;
        font-family: "Noto Serif SC", "SimSun", "Microsoft YaHei UI", "Microsoft YaHei", serif;
        font-size: 26px;
        font-weight: 900;
        outline: none;
      }

      .answer-input:focus {
        border-color: var(--jade);
        box-shadow: 0 0 0 4px rgba(8, 123, 108, 0.15);
      }

      .feedback {
        min-height: 70px;
        max-height: 182px;
        overflow: auto;
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        font-weight: 700;
      }

      .feedback.good {
        border-color: #8ed0c4;
        background: #ecf8f5;
        color: var(--jade-dark);
      }

      .feedback.warn {
        border-color: #ead083;
        background: #fff8df;
        color: #756018;
      }

      .feedback.bad {
        border-color: #e4a4a4;
        background: #fff0f0;
        color: #8f2828;
      }

      .accepted-title {
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .answers-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .answer-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(23, 33, 31, 0.16);
        color: var(--ink);
        font-size: 14px;
        font-weight: 900;
        white-space: nowrap;
      }

      .answer-chip small {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }

      .definition-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .definition-item {
        display: grid;
        gap: 3px;
        padding-top: 8px;
        border-top: 1px solid rgba(23, 33, 31, 0.12);
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
      }

      .definition-item strong {
        font-weight: 950;
      }

      .definition-item span {
        color: var(--muted);
      }

      .side {
        display: grid;
        gap: 1px;
        overflow: hidden;
      }

      .score-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        background: var(--line);
        gap: 1px;
      }

      .metric {
        min-height: 92px;
        padding: 14px;
        background: #fff;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 31px;
        line-height: 1;
        font-weight: 950;
      }

      .metric-value.small {
        font-size: 23px;
      }

      .source-panel,
      .list-panel {
        padding: 18px;
        background: #fff;
      }

      .source-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0;
        border-bottom: 1px solid #eef1ef;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .source-line:last-child {
        border-bottom: 0;
      }

      .source-line strong {
        color: var(--ink);
      }

      .list-title {
        margin: 0 0 12px;
        font-size: 14px;
        text-transform: uppercase;
        font-weight: 950;
        color: var(--muted);
      }

      .recent {
        display: grid;
        gap: 8px;
        min-height: 178px;
      }

      .recent-row {
        display: grid;
        grid-template-columns: 82px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 9px 0;
        border-bottom: 1px solid #eef1ef;
      }

      .recent-row:last-child {
        border-bottom: 0;
      }

      .recent-pattern {
        font-family: "Noto Serif SC", "SimSun", "Microsoft YaHei UI", "Microsoft YaHei", serif;
        font-size: 22px;
        font-weight: 900;
        white-space: nowrap;
      }

      .recent-main {
        min-width: 0;
      }

      .recent-answer {
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .recent-meta {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .recent-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 950;
        border-radius: 50%;
      }

      .recent-mark.ok {
        background: var(--jade);
      }

      .recent-mark.no {
        background: var(--red);
      }

      .empty-recent {
        display: grid;
        place-items: center;
        min-height: 150px;
        color: var(--muted);
        border: 1px dashed var(--line);
        font-weight: 800;
      }

      .overlays {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 22px;
        background: rgba(23, 33, 31, 0.52);
        z-index: 20;
      }

      .overlays.show {
        display: grid;
      }

      .modal {
        width: min(440px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 8px;
        padding: 24px;
      }

      .modal h2 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      .modal p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.5;
      }

      .launch-overlay {
        background: rgba(246, 248, 245, 0.9);
      }

      .launch-modal {
        width: min(580px, 100%);
      }

      .launch-kicker {
        margin: 0 0 8px;
        color: var(--jade-dark);
        font-size: 12px;
        font-weight: 950;
        text-transform: uppercase;
      }

      .difficulty-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 18px 0 20px;
      }

      .difficulty-option {
        min-height: 86px;
        display: grid;
        gap: 6px;
        justify-items: start;
        padding: 14px;
        background: #fff;
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 6px;
        text-align: left;
      }

      .difficulty-option.active {
        border-color: var(--jade);
        box-shadow: 0 0 0 4px rgba(8, 123, 108, 0.14);
      }

      .difficulty-name {
        font-size: 18px;
        font-weight: 950;
      }

      .difficulty-count {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      @media (max-width: 880px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
          padding: 18px 18px 10px;
        }

        .controls {
          justify-content: flex-start;
          width: 100%;
        }

        .game-shell {
          grid-template-columns: 1fr;
          padding: 10px 18px 24px;
        }

        .side {
          order: 3;
        }
      }

      @media (max-width: 620px) {
        h1 {
          font-size: 24px;
        }

        .brand-mark {
          width: 38px;
          height: 38px;
          font-size: 21px;
        }

        .route {
          min-height: 112px;
        }

        .train {
          width: 112px;
        }

        .station-labels {
          font-size: 10px;
        }

        .question-head,
        .answer-panel {
          padding: 14px;
        }

        .prompt-zone {
          padding: 24px 16px 18px;
        }

        .chengyu-card {
          min-height: 208px;
          padding: 18px;
        }

        .chengyu-text {
          grid-template-columns: repeat(var(--chengyu-columns, 4), minmax(42px, 66px));
          gap: 8px;
          font-size: 48px;
        }

        .answer-row {
          grid-template-columns: 1fr;
        }

        .answer-input,
        .primary,
        .secondary,
        .ghost {
          width: 100%;
        }

        .score-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .difficulty-options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand" aria-label="Hanzi De Go">
          <div class="brand-mark">成</div>
          <div>
            <h1>Hanzi De Go</h1>
            <div class="subtitle">成语缺字快答</div>
          </div>
        </div>
        <div class="controls">
          <div class="segmented" aria-label="题库">
            <button type="button" class="active" data-band="all">全部</button>
            <button type="button" data-band="common">常见</button>
            <button type="button" data-band="core">核心</button>
            <button type="button" data-band="rare">冷门</button>
            <button type="button" data-band="hardest">最难</button>
          </div>
          <button type="button" class="ghost" id="resetButton">Reset</button>
          <button type="button" class="primary" id="startButton">Start</button>
        </div>
      </header>

      <section class="game-shell">
        <div class="route" id="route" style="--train-x: 0%">
          <div class="route-sun" aria-hidden="true"></div>
          <div class="mountains" aria-hidden="true"></div>
          <div class="track-fill" aria-hidden="true"></div>
          <div class="track" aria-hidden="true"></div>
          <div class="train" aria-hidden="true">
            <div class="train-body"></div>
            <div class="wheel one"></div>
            <div class="wheel two"></div>
          </div>
          <div class="station-labels" aria-hidden="true">
            <span>起点</span>
            <span>常见</span>
            <span>核心</span>
            <span>冷门</span>
            <span>最难</span>
            <span>终点</span>
          </div>
        </div>

        <section class="stage" aria-labelledby="questionLabel">
          <div class="question-head">
            <span class="pill" id="questionLabel">成语</span>
            <div class="timer" id="timer">20</div>
          </div>
          <div class="prompt-zone">
            <div class="chengyu-card" aria-live="polite">
              <div class="chengyu-text" id="chengyuText">
                <span class="chengyu-char">准</span>
                <span class="chengyu-char">备</span>
                <span class="chengyu-char blank">□</span>
                <span class="chengyu-char">车</span>
              </div>
            </div>
          </div>
          <form class="answer-panel" id="answerForm">
            <div class="answer-row">
              <input
                class="answer-input"
                id="answerInput"
                name="answer"
                type="text"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                inputmode="text"
                maxlength="16"
                placeholder="填一个汉字"
                disabled
              />
              <button type="submit" class="secondary" id="submitButton" disabled>Go</button>
              <button type="button" class="ghost" id="skipButton" disabled>Skip</button>
            </div>
            <div class="feedback" id="feedback" aria-live="polite">准备发车</div>
          </form>
        </section>

        <aside class="side" aria-label="Game status">
          <div class="score-grid">
            <div class="metric">
              <div class="metric-label">Score</div>
              <div class="metric-value" id="score">0</div>
            </div>
            <div class="metric">
              <div class="metric-label">Streak</div>
              <div class="metric-value" id="streak">0</div>
            </div>
            <div class="metric">
              <div class="metric-label">Lives</div>
              <div class="metric-value small" id="lives">3</div>
            </div>
            <div class="metric">
              <div class="metric-label">Best</div>
              <div class="metric-value small" id="bestScore">0</div>
            </div>
          </div>
          <div class="source-panel">
            <div class="source-line"><span>题库</span><strong id="sourceCount">0</strong></div>
            <div class="source-line"><span>来源</span><strong>THUOCL + 词典</strong></div>
            <div class="source-line"><span>匹配</span><strong id="matchCount">0</strong></div>
          </div>
          <div class="list-panel">
            <h2 class="list-title">最近题目</h2>
            <div class="recent" id="recentList">
              <div class="empty-recent">暂无记录</div>
            </div>
          </div>
        </aside>
      </section>
    </main>

    <div class="overlays launch-overlay show" id="difficultyOverlay" role="dialog" aria-modal="true" aria-labelledby="difficultyTitle">
      <div class="modal launch-modal">
        <div class="launch-kicker">New run</div>
        <h2 id="difficultyTitle">Choose difficulty</h2>
        <p id="difficultyStatus">Select a word pool before the first question.</p>
        <div class="difficulty-options" role="radiogroup" aria-label="Difficulty">
          <button type="button" class="difficulty-option active" data-start-band="all" role="radio" aria-checked="true">
            <span class="difficulty-name">All</span>
            <span class="difficulty-count" data-start-count="all">0 words</span>
          </button>
          <button type="button" class="difficulty-option" data-start-band="common" role="radio" aria-checked="false">
            <span class="difficulty-name">Common</span>
            <span class="difficulty-count" data-start-count="common">0 words</span>
          </button>
          <button type="button" class="difficulty-option" data-start-band="core" role="radio" aria-checked="false">
            <span class="difficulty-name">Core</span>
            <span class="difficulty-count" data-start-count="core">0 words</span>
          </button>
          <button type="button" class="difficulty-option" data-start-band="rare" role="radio" aria-checked="false">
            <span class="difficulty-name">Rare</span>
            <span class="difficulty-count" data-start-count="rare">0 words</span>
          </button>
          <button type="button" class="difficulty-option" data-start-band="hardest" role="radio" aria-checked="false">
            <span class="difficulty-name">Hardest</span>
            <span class="difficulty-count" data-start-count="hardest">0 words</span>
          </button>
        </div>
        <div class="modal-actions">
          <button type="button" class="primary" id="launchStartButton">Start game</button>
        </div>
      </div>
    </div>

    <div class="overlays" id="gameOverOverlay" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="modal">
        <h2 id="gameOverTitle">本轮结束</h2>
        <p id="gameOverCopy">Score: 0</p>
        <div class="modal-actions">
          <button type="button" class="ghost" id="closeOverlayButton">Close</button>
          <button type="button" class="primary" id="playAgainButton">Play again</button>
        </div>
      </div>
    </div>

    <script src="chengyu_frequency.js"></script>
    <script>
      const DATA = window.CHENGYU_FREQUENCY_DATA || { entries: [], meta: {} };
      const ALL_ENTRIES = DATA.entries || [];
      const BAND_LABELS = {
        all: "全部",
        common: "常见",
        core: "核心",
        rare: "冷门",
        hardest: "最难",
      };
      const BAND_KEYS = ["common", "core", "rare", "hardest"];
      const DECKS = BAND_KEYS.reduce(
        (decks, band) => {
          decks[band] = ALL_ENTRIES.filter((entry) => entry.band === band);
          return decks;
        },
        { all: ALL_ENTRIES },
      );
      const QUESTION_SECONDS = 20;

      const state = {
        active: false,
        current: null,
        filter: "all",
        score: 0,
        streak: 0,
        lives: 3,
        seconds: QUESTION_SECONDS,
        correct: 0,
        answered: 0,
        guesses: 0,
        resolving: false,
        recent: [],
        lastWords: [],
        timerId: null,
      };

      const els = {
        route: document.getElementById("route"),
        startButton: document.getElementById("startButton"),
        resetButton: document.getElementById("resetButton"),
        skipButton: document.getElementById("skipButton"),
        submitButton: document.getElementById("submitButton"),
        answerForm: document.getElementById("answerForm"),
        answerInput: document.getElementById("answerInput"),
        feedback: document.getElementById("feedback"),
        chengyuText: document.getElementById("chengyuText"),
        questionLabel: document.getElementById("questionLabel"),
        timer: document.getElementById("timer"),
        score: document.getElementById("score"),
        streak: document.getElementById("streak"),
        lives: document.getElementById("lives"),
        bestScore: document.getElementById("bestScore"),
        sourceCount: document.getElementById("sourceCount"),
        matchCount: document.getElementById("matchCount"),
        recentList: document.getElementById("recentList"),
        difficultyOverlay: document.getElementById("difficultyOverlay"),
        difficultyStatus: document.getElementById("difficultyStatus"),
        launchStartButton: document.getElementById("launchStartButton"),
        overlay: document.getElementById("gameOverOverlay"),
        gameOverCopy: document.getElementById("gameOverCopy"),
        closeOverlayButton: document.getElementById("closeOverlayButton"),
        playAgainButton: document.getElementById("playAgainButton"),
        bandButtons: [...document.querySelectorAll("[data-band]")],
        startBandButtons: [...document.querySelectorAll("[data-start-band]")],
        startBandCounts: [...document.querySelectorAll("[data-start-count]")],
      };

      const hanPattern = /\p{Script=Han}/u;

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function bestKey() {
        return `hanzi-de-go-chengyu-best-${state.filter}`;
      }

      function getBestScore() {
        return Number(localStorage.getItem(bestKey()) || 0);
      }

      function setBestScore(score) {
        const best = getBestScore();
        if (score > best) {
          localStorage.setItem(bestKey(), String(score));
        }
      }

      function deck() {
        return DECKS[state.filter] || [];
      }

      function bandCount(band) {
        return (DECKS[band] || []).length;
      }

      function syncDifficultyControls() {
        els.bandButtons.forEach((button) => {
          button.disabled = bandCount(button.dataset.band) === 0;
          button.classList.toggle("active", button.dataset.band === state.filter);
        });

        els.startBandButtons.forEach((button) => {
          const band = button.dataset.startBand;
          const selected = band === state.filter;
          const hasEntries = bandCount(band) > 0;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-checked", String(selected));
          button.disabled = !hasEntries;
        });

        els.launchStartButton.disabled = bandCount(state.filter) === 0;

        els.startBandCounts.forEach((count) => {
          const total = bandCount(count.dataset.startCount).toLocaleString("zh-Hans-CN");
          count.textContent = `${total} words`;
        });
      }

      function selectDifficulty(band) {
        state.filter = band;
        if (bandCount(band) > 0) {
          els.difficultyStatus.textContent = "Select a word pool before the first question.";
        }
        syncDifficultyControls();
        render();
      }

      function showDifficultyOverlay() {
        syncDifficultyControls();
        els.difficultyOverlay.classList.add("show");
      }

      function hideDifficultyOverlay() {
        els.difficultyOverlay.classList.remove("show");
      }

      function toChars(word) {
        return [...word];
      }

      function normalizeChinese(input) {
        return [...input].filter((char) => hanPattern.test(char)).join("");
      }

      function makePattern(chars, blankIndex) {
        return chars.map((char, index) => (index === blankIndex ? "□" : char)).join("");
      }

      function compareEntries(a, b) {
        const aRank = a.rank || Number.MAX_SAFE_INTEGER;
        const bRank = b.rank || Number.MAX_SAFE_INTEGER;
        return b.frequency - a.frequency || aRank - bRank || a.word.localeCompare(b.word, "zh-Hans-CN");
      }

      function buildPatternIndex(entries) {
        const index = new Map();
        entries.forEach((entry) => {
          const chars = toChars(entry.word);
          chars.forEach((_, blankIndex) => {
            if (!hanPattern.test(chars[blankIndex])) return;
            const pattern = makePattern(chars, blankIndex);
            const matches = index.get(pattern) || [];
            matches.push(entry);
            index.set(pattern, matches);
          });
        });
        index.forEach((matches) => matches.sort(compareEntries));
        return index;
      }

      const PATTERN_INDEX = buildPatternIndex(ALL_ENTRIES);

      function acceptedFor(patternChars, blankIndex) {
        return PATTERN_INDEX.get(makePattern(patternChars, blankIndex)) || [];
      }

      function frequencyLabel(entry) {
        return entry.frequency > 0 ? `DF ${entry.frequency}` : "词典补充";
      }

      function rankLabel(entry) {
        return entry.rank ? `#${entry.rank}` : "词典补充";
      }

      function setQuestionControls(enabled) {
        els.answerInput.disabled = !enabled;
        els.submitButton.disabled = !enabled;
        els.skipButton.disabled = !enabled;
      }

      function chooseQuestion() {
        const pool = deck();
        if (pool.length === 0) {
          setFeedback("题库未加载", "bad");
          return;
        }

        const fresh = pool.filter((entry) => !state.lastWords.includes(entry.word));
        const choices = fresh.length > 0 ? fresh : pool;
        const source = choices[Math.floor(Math.random() * choices.length)];
        const chars = toChars(source.word);
        const blankableIndices = chars
          .map((char, index) => (hanPattern.test(char) ? index : null))
          .filter((index) => index !== null);
        const blankIndex = blankableIndices[Math.floor(Math.random() * blankableIndices.length)];
        const accepted = acceptedFor(chars, blankIndex);

        state.lastWords = [source.word, ...state.lastWords].slice(0, 12);
        state.seconds = QUESTION_SECONDS;
        state.guesses = 0;
        state.resolving = false;
        state.current = {
          source,
          chars,
          blankIndex,
          pattern: makePattern(chars, blankIndex),
          accepted,
        };
        setQuestionControls(true);
        renderQuestion();
      }

      function startGame() {
        if (deck().length === 0) {
          els.difficultyStatus.textContent = "No words available for this difficulty.";
          setFeedback("No words for this difficulty.", "bad");
          showDifficultyOverlay();
          return;
        }

        clearInterval(state.timerId);
        state.active = true;
        state.score = 0;
        state.streak = 0;
        state.lives = 3;
        state.seconds = QUESTION_SECONDS;
        state.correct = 0;
        state.answered = 0;
        state.guesses = 0;
        state.resolving = false;
        state.recent = [];
        state.lastWords = [];
        hideDifficultyOverlay();
        els.overlay.classList.remove("show");
        setQuestionControls(true);
        els.startButton.textContent = "Restart";
        setFeedback("下一站", "");
        chooseQuestion();
        render();
        els.answerInput.focus();
        state.timerId = setInterval(tick, 1000);
      }

      function resetGame({ showChooser = false } = {}) {
        clearInterval(state.timerId);
        state.active = false;
        state.current = null;
        state.score = 0;
        state.streak = 0;
        state.lives = 3;
        state.seconds = QUESTION_SECONDS;
        state.correct = 0;
        state.answered = 0;
        state.guesses = 0;
        state.resolving = false;
        state.recent = [];
        state.lastWords = [];
        els.chengyuText.innerHTML = renderPattern(["准", "备", "□", "车"], 2);
        els.questionLabel.textContent = BAND_LABELS[state.filter] || "成语";
        els.answerInput.value = "";
        setQuestionControls(false);
        els.startButton.textContent = "Start";
        els.overlay.classList.remove("show");
        if (showChooser) {
          showDifficultyOverlay();
        } else {
          hideDifficultyOverlay();
        }
        setFeedback("准备发车", "");
        render();
      }

      function tick() {
        if (!state.active || state.resolving) return;
        state.seconds -= 1;
        if (state.seconds <= 0) {
          state.seconds = 0;
          timeOutQuestion();
        }
        render();
      }

      function renderPattern(chars, blankIndex) {
        els.chengyuText.style.setProperty("--chengyu-columns", Math.min(chars.length, 4));
        return chars
          .map((char, index) => {
            const blank = index === blankIndex || char === "□";
            return `<span class="chengyu-char${blank ? " blank" : ""}">${blank ? "□" : escapeHtml(char)}</span>`;
          })
          .join("");
      }

      function renderQuestion() {
        if (!state.current) return;
        els.chengyuText.innerHTML = renderPattern(state.current.chars, state.current.blankIndex);
        els.questionLabel.textContent = `${BAND_LABELS[state.current.source.band]} · ${rankLabel(state.current.source)}`;
        els.matchCount.textContent = state.current.accepted.length;
        els.answerInput.value = "";
      }

      function render() {
        els.timer.textContent = state.seconds;
        els.score.textContent = state.score;
        els.streak.textContent = state.streak;
        els.lives.textContent = "●".repeat(state.lives) || "0";
        els.bestScore.textContent = getBestScore();
        els.sourceCount.textContent = deck().length.toLocaleString("zh-Hans-CN");
        if (!state.current) {
          els.matchCount.textContent = "0";
        }
        const progress = Math.min(100, Math.round((state.correct / 20) * 100));
        els.route.style.setProperty("--train-x", `${progress}%`);
        renderRecent();
      }

      function renderRecent() {
        if (state.recent.length === 0) {
          els.recentList.innerHTML = '<div class="empty-recent">暂无记录</div>';
          return;
        }

        els.recentList.innerHTML = state.recent
          .slice(0, 5)
          .map((item) => `
            <div class="recent-row">
              <div class="recent-pattern">${escapeHtml(item.pattern)}</div>
              <div class="recent-main">
                <div class="recent-answer">${escapeHtml(item.userAnswer || "跳过")} → ${escapeHtml(item.answerSummary)}</div>
                <div class="recent-meta">${item.acceptedCount} 个可能 · ${escapeHtml(item.sourceLabel)}</div>
              </div>
              <div class="recent-mark ${item.ok ? "ok" : "no"}">${item.ok ? "✓" : "×"}</div>
            </div>
          `)
          .join("");
      }

      function setFeedback(message, mood) {
        els.feedback.className = `feedback${mood ? ` ${mood}` : ""}`;
        els.feedback.textContent = message;
      }

      function setFeedbackHtml(html, mood) {
        els.feedback.className = `feedback${mood ? ` ${mood}` : ""}`;
        els.feedback.innerHTML = html;
      }

      function definitionText(entry) {
        return entry.explanation || "暂无释义";
      }

      function definitionsHtml(entries, revealWords) {
        return `
          <div class="definition-list">
            ${entries
              .map((entry) => `
                <div class="definition-item">
                  <strong>${revealWords ? escapeHtml(entry.word) : "释义"}</strong>
                  <span>${escapeHtml(definitionText(entry))}</span>
                </div>
              `)
              .join("")}
          </div>
        `;
      }

      function acceptedHtml(current, ok, reason) {
        const chips = current.accepted
          .map((entry) => {
            const meta = `<small>${escapeHtml(frequencyLabel(entry))}</small>`;
            return `<span class="answer-chip">${escapeHtml(entry.word)} ${meta}</span>`;
          })
          .join("");
        const title = ok ? "可填" : reason || "答案";
        return `
          <div class="accepted-title">${title}: ${current.pattern} · ${current.accepted.length} 个可能</div>
          <div class="answers-list">${chips}</div>
          ${definitionsHtml(current.accepted, true)}
        `;
      }

      function guessFeedbackHtml(current, userAnswer) {
        return `
          <div class="accepted-title">再试一次: ${escapeHtml(userAnswer)} 不匹配 ${current.pattern}</div>
          ${definitionsHtml([current.source], false)}
        `;
      }

      function answerCurrent() {
        if (!state.active || !state.current || state.resolving) return;
        const raw = normalizeChinese(els.answerInput.value);
        if (!raw) {
          setFeedback("填入汉字", "warn");
          els.answerInput.focus();
          return;
        }

        const current = state.current;
        state.guesses += 1;
        const ok = current.accepted.some((entry) => {
          const chars = toChars(entry.word);
          return raw === chars[current.blankIndex] || raw === normalizeChinese(entry.word);
        });

        if (ok) {
          resolveQuestion({ ok: true, userAnswer: raw, mood: "good", reason: "可填", loseLife: false });
          return;
        }

        state.streak = 0;
        els.answerInput.value = "";
        setFeedbackHtml(guessFeedbackHtml(current, raw), "warn");
        render();
        els.answerInput.focus();
      }

      function resolveQuestion({ ok, userAnswer, mood, reason, loseLife }) {
        const current = state.current;
        state.resolving = true;
        setQuestionControls(false);
        state.answered += 1;
        if (loseLife) {
          state.lives -= 1;
        }
        if (ok) {
          const missPenalty = Math.max(0, state.guesses - 1) * 20;
          state.score += Math.max(25, 100 + state.streak * 10 - missPenalty);
          state.streak += 1;
          state.correct += 1;
        } else {
          state.streak = 0;
        }
        state.recent.unshift({
          pattern: current.pattern,
          userAnswer,
          answerSummary: current.accepted.map((entry) => entry.word).join("、"),
          acceptedCount: current.accepted.length,
          sourceLabel: frequencyLabel(current.source),
          ok,
        });
        setFeedbackHtml(acceptedHtml(current, ok, reason), mood);
        render();

        if (state.lives <= 0) {
          setTimeout(endGame, 650);
          return;
        }
        setTimeout(() => {
          if (state.active) {
            chooseQuestion();
            els.answerInput.focus();
          }
        }, 1200);
      }

      function skipQuestion() {
        if (!state.active || !state.current || state.resolving) return;
        resolveQuestion({ ok: false, userAnswer: "", mood: "bad", reason: "跳过", loseLife: true });
      }

      function timeOutQuestion() {
        if (!state.active || !state.current || state.resolving) return;
        resolveQuestion({ ok: false, userAnswer: "超时", mood: "bad", reason: "时间到", loseLife: true });
      }

      function endGame() {
        if (!state.active) return;
        clearInterval(state.timerId);
        state.active = false;
        setBestScore(state.score);
        state.resolving = false;
        setQuestionControls(false);
        els.startButton.textContent = "Start";
        els.gameOverCopy.textContent = `Score: ${state.score} · Correct: ${state.correct}/${state.answered}`;
        els.overlay.classList.add("show");
        render();
      }

      els.answerForm.addEventListener("submit", (event) => {
        event.preventDefault();
        answerCurrent();
      });

      els.startButton.addEventListener("click", () => {
        if (state.active) {
          startGame();
          return;
        }
        showDifficultyOverlay();
      });
      els.launchStartButton.addEventListener("click", startGame);
      els.resetButton.addEventListener("click", () => resetGame({ showChooser: true }));
      els.skipButton.addEventListener("click", skipQuestion);
      els.playAgainButton.addEventListener("click", startGame);
      els.closeOverlayButton.addEventListener("click", () => {
        els.overlay.classList.remove("show");
      });

      els.startBandButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectDifficulty(button.dataset.startBand);
        });
      });

      els.bandButtons.forEach((button) => {
        button.addEventListener("click", () => {
          selectDifficulty(button.dataset.band);
          resetGame({ showChooser: true });
        });
      });

      resetGame({ showChooser: true });

      if (ALL_ENTRIES.length === 0) {
        setFeedback("题库未加载", "bad");
        els.startButton.disabled = true;
        els.launchStartButton.disabled = true;
        els.difficultyStatus.textContent = "Question set failed to load.";
      }
    </script>
  </body>
</html>
